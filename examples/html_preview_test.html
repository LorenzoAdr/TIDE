<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prueba de vista HTML — TIDE</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
      background: #10131a;
      color: #edf2f7;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
    }

    main {
      width: min(560px, calc(100% - 48px));
      padding: 32px;
      border: 1px solid #334155;
      border-radius: 18px;
      background: #19202d;
      box-shadow: 0 18px 50px #0008;
    }

    h1 {
      margin-top: 0;
      color: #7dd3fc;
    }

    button {
      padding: 10px 16px;
      border: 0;
      border-radius: 9px;
      background: #38bdf8;
      color: #082f49;
      font-weight: 700;
      cursor: pointer;
    }

    #result {
      min-height: 24px;
      color: #86efac;
    }
  </style>
</head>
<body>
  <main>
    <h1>Vista HTML de TIDE</h1>
    <p>Si estás viendo esta tarjeta en tu navegador, la apertura externa funciona correctamente.</p>
    <button id="test-button" type="button">Probar JavaScript</button>
    <p id="result" aria-live="polite"></p>
  </main>

  <script>
    document.querySelector("#test-button").addEventListener("click", () => {
      document.querySelector("#result").textContent =
        `✓ JavaScript funciona (${new Date().toLocaleTimeString()})`;
    });
  </script>
</body>
</html>
